<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dasbor Kehidupan</title>
  <style>
    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f1a;
      --card:      #1a1a2e;
      --card2:     #16213e;
      --accent:    #e94560;
      --accent2:   #0f3460;
      --text:      #eaeaea;
      --muted:     #8892a4;
      --green:     #4ecca3;
      --yellow:    #f6c90e;
      --radius:    14px;
      --shadow:    0 8px 32px rgba(0,0,0,.45);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    h2 { font-size: 1rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }

    /* ─── Grid Layout ─── */
    .dashboard {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "clock  clock"
        "todo   focus"
        "links  links";
    }

    @media (max-width: 680px) {
      .dashboard {
        grid-template-columns: 1fr;
        grid-template-areas: "clock" "todo" "focus" "links";
      }
    }

    /* ─── Card ─── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.05);
    }

    /* ─── Clock ─── */
    #clock-card { grid-area: clock; text-align: center; background: linear-gradient(135deg, var(--card2), var(--accent2)); }

    #time {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 700;
      letter-spacing: .04em;
      color: #fff;
      line-height: 1;
    }

    #date-display {
      margin-top: 8px;
      font-size: 1.05rem;
      color: var(--muted);
    }

    #greeting {
      margin-top: 6px;
      font-size: 1.15rem;
      color: var(--green);
      font-weight: 500;
    }

    /* ─── To-Do List ─── */
    #todo-card { grid-area: todo; }

    .todo-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-input-row input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border .2s;
    }

    .todo-input-row input:focus { border-color: var(--accent); }

    .todo-input-row input::placeholder { color: var(--muted); }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      transition: filter .2s, transform .1s;
    }

    .btn:active { transform: scale(.96); }
    .btn:hover  { filter: brightness(1.15); }

    .btn-accent { background: var(--accent); color: #fff; }
    .btn-green  { background: var(--green);  color: #0f0f1a; }
    .btn-yellow { background: var(--yellow); color: #0f0f1a; }
    .btn-muted  { background: rgba(255,255,255,.1); color: var(--text); }

    /* Stats bar */
    .todo-stats {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      font-size: .82rem;
      color: var(--muted);
    }

    .todo-stats span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green  { background: var(--green); }
    .dot-accent { background: var(--accent); }

    /* Filter buttons */
    .todo-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .82rem;
      transition: all .2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Todo list */
    #todo-list {
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #todo-list::-webkit-scrollbar { width: 4px; }
    #todo-list::-webkit-scrollbar-track { background: transparent; }
    #todo-list::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 4px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,.04);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.06);
      transition: background .2s;
      animation: slideIn .25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover { background: rgba(255,255,255,.07); }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-check {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }

    .todo-item.done .todo-check {
      background: var(--green);
      border-color: var(--green);
    }

    .todo-check::after {
      content: '✓';
      color: #0f0f1a;
      font-size: .7rem;
      font-weight: 700;
      display: none;
    }

    .todo-item.done .todo-check::after { display: block; }

    .todo-text { flex: 1; font-size: .93rem; }

    .todo-priority {
      font-size: .7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .priority-high   { background: rgba(233,69,96,.2);  color: var(--accent); }
    .priority-medium { background: rgba(246,201,14,.2); color: var(--yellow); }
    .priority-low    { background: rgba(78,204,163,.2); color: var(--green);  }

    .todo-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color .2s;
      flex-shrink: 0;
    }

    .todo-delete:hover { color: var(--accent); }

    .todo-empty {
      text-align: center;
      padding: 30px 0;
      color: var(--muted);
      font-size: .9rem;
    }

    /* priority selector */
    .priority-select {
      padding: 10px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-size: .85rem;
      cursor: pointer;
    }

    .priority-select option { background: #1a1a2e; }

    /* Clear done button */
    .todo-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    /* ─── Focus Timer ─── */
    #focus-card { grid-area: focus; }

    .timer-display {
      text-align: center;
      margin: 10px 0 20px;
    }

    .timer-ring {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 16px;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
      width: 100%; height: 100%;
    }

    .timer-ring .bg-circle { stroke: rgba(255,255,255,.07); }
    .timer-ring .fg-circle {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset .9s linear, stroke .3s;
    }

    .timer-ring .timer-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      pointer-events: none;
    }

    .timer-label {
      font-size: .85rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    .timer-presets {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .preset-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .82rem;
      transition: all .2s;
    }

    .preset-btn.active, .preset-btn:hover {
      background: var(--accent2);
      border-color: var(--accent2);
      color: #fff;
    }

    .timer-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .session-count {
      text-align: center;
      margin-top: 14px;
      font-size: .85rem;
      color: var(--muted);
    }

    .session-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }

    .session-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      transition: background .3s;
    }

    .session-dot.done { background: var(--accent); }

    /* ─── Quick Links ─── */
    #links-card { grid-area: links; }

    .links-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .links-header h2 { margin-bottom: 0; }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      text-decoration: none;
      color: var(--text);
      transition: all .2s;
      cursor: pointer;
      position: relative;
    }

    .link-card:hover {
      background: rgba(255,255,255,.09);
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .link-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      background: rgba(255,255,255,.07);
    }

    .link-name {
      font-size: .82rem;
      font-weight: 600;
      text-align: center;
    }

    .link-delete-btn {
      position: absolute;
      top: 5px; right: 7px;
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: .75rem;
      transition: color .15s;
    }

    .link-card:hover .link-delete-btn { color: var(--muted); }
    .link-delete-btn:hover { color: var(--accent) !important; }

    /* Add link form */
    #add-link-form {
      display: none;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    #add-link-form.open { display: flex; }

    #add-link-form input {
      flex: 1;
      min-width: 120px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-size: .88rem;
      outline: none;
    }

    #add-link-form input:focus { border-color: var(--accent); }
    #add-link-form input::placeholder { color: var(--muted); }

    /* ─── Notification toast ─── */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--card);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: .9rem;
      box-shadow: var(--shadow);
      transform: translateY(100px);
      opacity: 0;
      transition: all .35s ease;
      z-index: 999;
      max-width: 280px;
    }

    #toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
<div class="dashboard">

  <!-- ─── Clock ─── -->
  <div class="card" id="clock-card">
    <div id="time">00:00:00</div>
    <div id="date-display">Kamis, 8 Oktober 2026</div>
    <div id="greeting">Selamat datang! 👋</div>
  </div>

  <!-- ─── To-Do List ─── -->
  <div class="card" id="todo-card">
    <h2>📝 Daftar Tugas</h2>

    <div class="todo-input-row">
      <input type="text" id="todo-input" placeholder="Tambah tugas baru…" />
      <select class="priority-select" id="priority-select">
        <option value="medium">⚡ Sedang</option>
        <option value="high">🔴 Tinggi</option>
        <option value="low">🟢 Rendah</option>
      </select>
      <button class="btn btn-accent" onclick="addTodo()">＋</button>
    </div>

    <div class="todo-stats">
      <span><span class="dot dot-green"></span><span id="done-count">0</span> selesai</span>
      <span><span class="dot dot-accent"></span><span id="left-count">0</span> tersisa</span>
    </div>

    <div class="todo-filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">Semua</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Aktif</button>
      <button class="filter-btn" onclick="setFilter('done', this)">Selesai</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="todo-actions">
      <button class="btn btn-muted" style="font-size:.8rem;padding:7px 14px;" onclick="clearDone()">Hapus yang Selesai</button>
    </div>
  </div>

  <!-- ─── Focus Timer (Pomodoro) ─── -->
  <div class="card" id="focus-card">
    <h2>⏱ Timer Fokus</h2>

    <div class="timer-display">
      <div class="timer-ring">
        <svg viewBox="0 0 160 160">
          <circle class="bg-circle" cx="80" cy="80" r="70" fill="none" stroke-width="8" />
          <circle class="fg-circle" id="timer-arc" cx="80" cy="80" r="70" fill="none" stroke-width="8"
            stroke-dasharray="439.82"
            stroke-dashoffset="0" />
        </svg>
        <div class="timer-text" id="timer-display">25:00</div>
      </div>
      <div class="timer-label" id="timer-label">🎯 Sesi Fokus</div>
    </div>

    <div class="timer-presets">
      <button class="preset-btn active" onclick="setPreset(25, 'focus', this)">25 menit</button>
      <button class="preset-btn" onclick="setPreset(15, 'focus', this)">15 menit</button>
      <button class="preset-btn" onclick="setPreset(5, 'break', this)">5 mnt istirahat</button>
      <button class="preset-btn" onclick="setPreset(10, 'break', this)">10 mnt istirahat</button>
    </div>

    <div class="timer-controls">
      <button class="btn btn-accent" id="timer-start-btn" onclick="toggleTimer()">▶ Mulai</button>
      <button class="btn btn-muted" onclick="resetTimer()">↺ Reset</button>
    </div>

    <div class="session-count">
      Sesi selesai hari ini: <strong id="session-num">0</strong>
      <div class="session-dots" id="session-dots">
        <div class="session-dot"></div>
        <div class="session-dot"></div>
        <div class="session-dot"></div>
        <div class="session-dot"></div>
      </div>
    </div>
  </div>

  <!-- ─── Quick Links ─── -->
  <div class="card" id="links-card">
    <div class="links-header">
      <h2>🔗 Tautan Cepat</h2>
      <button class="btn btn-accent" style="font-size:.8rem;padding:7px 14px;" onclick="toggleAddLink()">＋ Tambah</button>
    </div>

    <div class="links-grid" id="links-grid"></div>

    <form id="add-link-form" onsubmit="addLink(event)">
      <input type="text" id="link-name" placeholder="Nama (mis. Google)" required maxlength="24" />
      <input type="url"  id="link-url"  placeholder="https://..." required />
      <input type="text" id="link-emoji" placeholder="Emoji ikon (mis. 🌐)" maxlength="4" />
      <button class="btn btn-green" type="submit">Simpan</button>
      <button class="btn btn-muted" type="button" onclick="toggleAddLink()">Batal</button>
    </form>
  </div>

</div>

<!-- Toast notification -->
<div id="toast"></div>

<script>
  // ═══════════════════════════════════════════════
  //  CLOCK
  // ═══════════════════════════════════════════════
  const DAYS   = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  function updateClock() {
    const now  = new Date();
    const h    = String(now.getHours()).padStart(2,'0');
    const m    = String(now.getMinutes()).padStart(2,'0');
    const s    = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;

    const day  = DAYS[now.getDay()];
    const date = now.getDate();
    const mon  = MONTHS[now.getMonth()];
    const year = now.getFullYear();
    document.getElementById('date-display').textContent = `${day}, ${date} ${mon} ${year}`;

    const hour = now.getHours();
    let greet;
    if (hour < 5)       greet = '🌙 Selamat tengah malam!';
    else if (hour < 11) greet = '🌅 Selamat pagi!';
    else if (hour < 15) greet = '☀️ Selamat siang!';
    else if (hour < 18) greet = '🌤 Selamat sore!';
    else                greet = '🌙 Selamat malam!';
    document.getElementById('greeting').textContent = greet;
  }

  setInterval(updateClock, 1000);
  updateClock();

  // ═══════════════════════════════════════════════
  //  TO-DO LIST
  // ═══════════════════════════════════════════════
  let todos  = JSON.parse(localStorage.getItem('todos') || '[]');
  let filter = 'all';

  function saveTodos() {
    localStorage.setItem('todos', JSON.stringify(todos));
  }

  function renderTodos() {
    const list = document.getElementById('todo-list');
    const filtered = todos.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done')   return  t.done;
      return true;
    });

    if (filtered.length === 0) {
      list.innerHTML = '<div class="todo-empty">Tidak ada tugas di sini 🎉</div>';
    } else {
      list.innerHTML = filtered.map(t => `
        <li class="todo-item${t.done ? ' done' : ''}" data-id="${t.id}">
          <div class="todo-check" onclick="toggleTodo(${t.id})"></div>
          <span class="todo-text">${escHtml(t.text)}</span>
          <span class="todo-priority priority-${t.priority}">${priorityLabel(t.priority)}</span>
          <button class="todo-delete" onclick="deleteTodo(${t.id})" title="Hapus">✕</button>
        </li>`).join('');
    }

    const done = todos.filter(t => t.done).length;
    document.getElementById('done-count').textContent = done;
    document.getElementById('left-count').textContent = todos.length - done;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function priorityLabel(p) {
    return { high: '🔴 Tinggi', medium: '⚡ Sedang', low: '🟢 Rendah' }[p] || p;
  }

  function addTodo() {
    const input = document.getElementById('todo-input');
    const text  = input.value.trim();
    if (!text) return;
    const priority = document.getElementById('priority-select').value;
    todos.unshift({ id: Date.now(), text, done: false, priority });
    saveTodos();
    renderTodos();
    input.value = '';
    input.focus();
    showToast('✅ Tugas ditambahkan!');
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; saveTodos(); renderTodos(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos();
    renderTodos();
  }

  function clearDone() {
    const count = todos.filter(t => t.done).length;
    if (!count) { showToast('Tidak ada tugas selesai.'); return; }
    todos = todos.filter(t => !t.done);
    saveTodos();
    renderTodos();
    showToast(`🗑 ${count} tugas selesai dihapus`);
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
  }

  // Enter key support
  document.getElementById('todo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  renderTodos();

  // ═══════════════════════════════════════════════
  //  FOCUS TIMER (Pomodoro)
  // ═══════════════════════════════════════════════
  const CIRCUMFERENCE = 2 * Math.PI * 70; // 439.82
  let timerTotal    = 25 * 60;
  let timerLeft     = timerTotal;
  let timerInterval = null;
  let isRunning     = false;
  let isBreak       = false;
  let sessions      = parseInt(localStorage.getItem('sessions') || '0');

  function formatTime(secs) {
    const m = String(Math.floor(secs / 60)).padStart(2,'0');
    const s = String(secs % 60).padStart(2,'0');
    return `${m}:${s}`;
  }

  function updateTimerUI() {
    document.getElementById('timer-display').textContent = formatTime(timerLeft);
    const progress = timerLeft / timerTotal;
    const offset   = CIRCUMFERENCE * (1 - progress);
    const arc = document.getElementById('timer-arc');
    arc.style.strokeDashoffset = offset;
    arc.style.stroke = isBreak ? 'var(--green)' : 'var(--accent)';
    document.getElementById('timer-label').textContent =
      isBreak ? '☕ Istirahat' : '🎯 Sesi Fokus';
  }

  function toggleTimer() {
    if (isRunning) {
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('timer-start-btn').textContent = '▶ Lanjut';
    } else {
      isRunning = true;
      document.getElementById('timer-start-btn').textContent = '⏸ Jeda';
      timerInterval = setInterval(() => {
        timerLeft--;
        updateTimerUI();
        if (timerLeft <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          if (!isBreak) {
            sessions++;
            localStorage.setItem('sessions', sessions);
            updateSessionDots();
            showToast('🎉 Sesi fokus selesai! Waktunya istirahat.');
          } else {
            showToast('⚡ Istirahat selesai! Ayo fokus lagi!');
          }
          document.getElementById('timer-start-btn').textContent = '▶ Mulai';
        }
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    timerLeft = timerTotal;
    updateTimerUI();
    document.getElementById('timer-start-btn').textContent = '▶ Mulai';
  }

  function setPreset(minutes, mode, btn) {
    clearInterval(timerInterval);
    isRunning = false;
    isBreak   = mode === 'break';
    timerTotal = minutes * 60;
    timerLeft  = timerTotal;
    updateTimerUI();
    document.getElementById('timer-start-btn').textContent = '▶ Mulai';
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function updateSessionDots() {
    const dots = document.querySelectorAll('.session-dot');
    document.getElementById('session-num').textContent = sessions;
    dots.forEach((d, i) => {
      d.classList.toggle('done', i < (sessions % 4));
    });
    if (sessions > 0 && sessions % 4 === 0) {
      showToast('🏆 4 sesi selesai! Ambil istirahat panjang!');
    }
  }

  updateTimerUI();
  updateSessionDots();

  // ═══════════════════════════════════════════════
  //  QUICK LINKS
  // ═══════════════════════════════════════════════
  const DEFAULT_LINKS = [
    { id: 1, name: 'Google',    url: 'https://google.com',    emoji: '🔍' },
    { id: 2, name: 'YouTube',   url: 'https://youtube.com',   emoji: '▶️' },
    { id: 3, name: 'Wikipedia', url: 'https://wikipedia.org', emoji: '📖' },
    { id: 4, name: 'GitHub',    url: 'https://github.com',    emoji: '🐙' },
    { id: 5, name: 'Gmail',     url: 'https://mail.google.com', emoji: '📧' },
    { id: 6, name: 'ChatGPT',   url: 'https://chat.openai.com', emoji: '🤖' },
  ];

  let links = JSON.parse(localStorage.getItem('links') || 'null') || DEFAULT_LINKS;

  function saveLinks() { localStorage.setItem('links', JSON.stringify(links)); }

  function renderLinks() {
    const grid = document.getElementById('links-grid');
    grid.innerHTML = links.map(l => `
      <a class="link-card" href="${l.url}" target="_blank" rel="noopener">
        <button class="link-delete-btn" onclick="deleteLink(event, ${l.id})" title="Hapus">✕</button>
        <div class="link-icon">${l.emoji || '🌐'}</div>
        <div class="link-name">${escHtml(l.name)}</div>
      </a>`).join('');
  }

  function toggleAddLink() {
    const form = document.getElementById('add-link-form');
    form.classList.toggle('open');
    if (form.classList.contains('open')) document.getElementById('link-name').focus();
  }

  function addLink(e) {
    e.preventDefault();
    const name  = document.getElementById('link-name').value.trim();
    const url   = document.getElementById('link-url').value.trim();
    const emoji = document.getElementById('link-emoji').value.trim() || '🌐';
    if (!name || !url) return;
    links.push({ id: Date.now(), name, url, emoji });
    saveLinks();
    renderLinks();
    e.target.reset();
    toggleAddLink();
    showToast('🔗 Tautan ditambahkan!');
  }

  function deleteLink(e, id) {
    e.preventDefault();
    e.stopPropagation();
    links = links.filter(l => l.id !== id);
    saveLinks();
    renderLinks();
  }

  renderLinks();

  // ═══════════════════════════════════════════════
  //  TOAST NOTIFICATION
  // ═══════════════════════════════════════════════
  let toastTimeout;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
